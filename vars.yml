---
# playbook/vars.yml

# Dettagli di connessione per ManageIQ
manageiq_host: "manageiq"
#manageiq_port: "3443"
manageiq_user: "admin"
manageiq_password: "smartvm"
ip_address_appliance: 172.16.0.174

# Dettagli del provider
provider_name: "DevStack"
provider_type: "ManageIQ::Providers::Openstack::CloudManager"
remove_existing: false

# Sezione per la definizione dei service catalogs
catalogs_to_create:
  - name: "IaaS"
    description: "Catalogo per servizi di Infrastructure as a Service"
  - name: "Altri Servizi"
    description: "Catalogo dei vari servizi"
  - name: "Servizi extra"
    description: "Catalogo per servizi aggiuntivi"
  

# --- NUOVA SEZIONE: Definizione dei Dialoghi di Servizio ---
service_dialogs_to_create:
  - name: "BlockStorageDialog"
    description: "Richiede i parametri per un nuovo Block Storage"
    label: "Crea Block Storage"
    dialog_tabs:
      - label: "Informazioni di base"
        position: 0
        dialog_groups:
          - label: "Dettagli Volume"
            position: 0
            dialog_fields:
              - name: "volume_name"
                label: "Nome Volume"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                position: 0
              - name: "volume_size"
                label: "Dimensione (GB)"
                type: "DialogFieldTextBox"
                data_type: "integer"
                required: true
                default_value: "10"
                position: 1

  - name: "CreateVMDialog"
    description: "Richiede i parametri per una nuova VM OpenStack"
    label: "Crea Virtual Machine"
    dialog_tabs:
      - label: "Configurazione VM"
        position: 0
        dialog_groups:
          - label: "Opzioni Principali"
            position: 0
            dialog_fields:
              - name: "vm_name"
                label: "Nome VM"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                position: 0
              # In un caso reale, qui ci sarebbero dropdown per flavor, image, network, etc.
              # Per semplicità, li teniamo come campi di testo.
              - name: "flavor_name"
                label: "Flavor (es. m1.small)"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                default_value: "m1.small"
                position: 1
              - name: "image_name"
                label: "Immagine (es. RockyLinux-9-x86_64)"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                default_value: "RockyLinux-9-x86_64"
                position: 2
    
  - name: "Nginx_Service_Dialog"
    description: "Richiede i parametri per un Server Nginx"
    label: "Crea Server Nginx"
    dialog_tabs:
      - label: "Informazioni di base"
        position: 0
        dialog_groups:
          - label: "Dettagli Servizio"
            position: 0
            dialog_fields:
              - name: "service_name"
                label: "Nome Servizio"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                position: 0

  - name: "GitLab_Service_Dialog"
    description: "Richiede i parametri per un Server GitLab"
    label: "Crea Server GitLab"
    dialog_tabs:
      - label: "Informazioni di base"
        position: 0
        dialog_groups:
          - label: "Dettagli Servizio"
            position: 0
            dialog_fields:
              - name: "gitlab_root_password"
                label: "GitLab root Password"
                type: "DialogFieldTextBox"
                #options: {:protected => true} #Per mascherare la password
                required: true
                position: 0
              - name: "fqdn"
                label: "FQDN"
                type: "DialogFieldTextBox"
                required: true
                position: 1
              - name: "smtp_server"
                label: "SMTP Server"
                type: "DialogFieldTextBox"
                required: true
                position: 2
              - name: "smtp_port"
                label: "SMTP Port"
                type: "DialogFieldTextBox"
                data_type: "integer"
                default_value: "0"
                required: false
                position: 3
              - name: "smtp_username"
                label: "SMTP Username"
                type: "DialogFieldTextBox"
                required: true
                position: 4
              - name: "smtp_password"
                label: "SMTP Password"
                type: "DialogFieldTextBox"
                #options: {:protected => true}
                required: true
                position: 5
              - name: "tls_ssl"
                label: "TLS/SSL?"
                type: "DialogFieldCheckBox"
                default_value: false # Non era selezionato
                position: 6

  - name: "Jenkins_Service_Dialog"
    description: "Richiede i parametri per un Server Jenkins"
    label: "Crea Server Jenkins"
    dialog_tabs:
      - label: "Informazioni di base"
        position: 0
        dialog_groups:
          - label: "Dettagli Servizio"
            position: 0
            dialog_fields:
              - name: "service_name"
                label: "Nome Servizio"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                position: 0

  - name: "MinIO_Service_Dialog"
    description: "Richiede i parametri per un Server MinIO"
    label: "Crea Server MinIO"
    dialog_tabs:
      - label: "Informazioni di base"
        position: 0
        dialog_groups:
          - label: "Dettagli Servizio"
            position: 0
            dialog_fields:
              - name: "service_name"
                label: "Nome Servizio"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                position: 0

  - name: "MySQL_Service_Dialog"
    description: "Richiede i parametri per un Server MySQL"
    label: "Crea Server MySQL"
    dialog_tabs:
      - label: "Informazioni di base"
        position: 0
        dialog_groups:
          - label: "Dettagli Servizio"
            position: 0
            dialog_fields:
              - name: "service_name"
                label: "Nome Servizio"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                position: 0

  - name: "Nextcloud_Service_Dialog"
    description: "Richiede i parametri per un Server Nextcloud"
    label: "Crea Server Nextcloud"
    dialog_tabs:
      - label: "Informazioni di base"
        position: 0
        dialog_groups:
          - label: "Dettagli Servizio"
            position: 0
            dialog_fields:
              - name: "service_name"
                label: "Nome Servizio"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                position: 0

  - name: "PostgreSQL_Service_Dialog"
    description: "Richiede i parametri per un Server PostgreSQL"
    label: "Crea Server PostgreSQL"
    dialog_tabs:
      - label: "Informazioni di base"
        position: 0
        dialog_groups:
          - label: "Dettagli Servizio"
            position: 0
            dialog_fields:
              - name: "service_name"
                label: "Nome Servizio"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                position: 0

  - name: "Wordpress_Service_Dialog"
    description: "Richiede i parametri per un Server WordPress"
    label: "Crea Server WordPress"
    dialog_tabs:
      - label: "Informazioni di base"
        position: 0
        dialog_groups:
          - label: "Dettagli Servizio"
            position: 0
            dialog_fields:
              - name: "service_name"
                label: "Nome Servizio"
                type: "DialogFieldTextBox"
                data_type: "string"
                required: true
                position: 0
icons_to_upload: 
  - name: "Nginx_Icon"
    filename: "Nginx.png"
    local_path: "icons/Nginx.png"
  
  - name: "Nextcloud_Icon"
    filename: "Nextcloud.png"
    local_path: "icons/Nextcloud.png"
# --- NUOVA SEZIONE: Definizione dei Service Templates (Servizi) ---
service_templates_to_create:
  - name: "Block Storage"
    description: "Crea un Block Storage"
    prov_type: "generic" # Tipo Generico come da immagine
    catalog_name: "IaaS"
    dialog_name: "BlockStorageDialog"

  - name: "Crea una Virtual Machine"
    description: "Crea una Virtual Machine"
    prov_type: "openstack" # Tipo OpenStack come da immagine
    catalog_name: "IaaS"
    dialog_name: "CreateVMDialog"

  - name: "Apache Web Server"
    description: "Apache Web Server"
    prov_type: "generic"
    catalog_name: "Altri Servizi"
    dialog_name: "Nginx_Service_Dialog" # Nello screenshot usa questo dialog
    picture_name: "Nginx_Icon"

  - name: "Server GitLab"
    description: "Server GitLab"
    prov_type: "generic"
